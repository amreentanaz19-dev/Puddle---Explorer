<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a5f'/%3E%3Cpath d='M32 8v28H12z' fill='%23e0432f'/%3E%3Cpath d='M32 14v22h20z' fill='%23f06a4f'/%3E%3Cpath d='M6 38h52l-9 14H15z' fill='%23e0432f'/%3E%3C/svg%3E"><meta property="og:title" content="Puddle Explorer"><meta property="og:description" content="Small boat. Big adventures. Race your paper boat down a flooded monsoon lane."><meta name="color-scheme" content="dark light"><title>Puddle Explorer</title>
<meta name="description" content="Run to the stream, drop your paper boat and race your friends down a flooded places around the world.">
<meta name="theme-color" content="#1f3a5f">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen painted 3D lane; paper-cut panels float over it for story steps. */
:root{--paper:#faf0d2;--ink:#1f3a5f;--mut:#6a5b40;--acc:#d9432b;--hud:rgba(16,28,38,.62);--bg:#26343b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#223247;--ink:#f3e6c8;--mut:#b9ad90;--acc:#ff8a66;--bg:#10181d;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#223247;--ink:#f3e6c8;--mut:#b9ad90;--acc:#ff8a66;--bg:#10181d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#fff;font-family:'Baloo 2',Figtree,system-ui,sans-serif;font-weight:700;letter-spacing:.01em;font-size:18px;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.sc-fold::before{content:"";position:fixed;inset:0;background:rgba(8,14,20,.38);z-index:1;pointer-events:none}
#ov{position:fixed;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none;overflow:auto}
#ov>*{pointer-events:auto}
@media(min-width:900px){#ov{align-items:center;justify-content:flex-start;padding-left:6vw}}
body.sc-fold #ov,body.sc-end #ov,body.sc-title #ov{align-items:center;justify-content:center;padding-left:14px}
svg.defs{position:absolute;width:0;height:0}
.paper{position:relative;isolation:isolate;max-width:520px;width:100%;padding:26px 28px 24px;color:var(--ink);text-align:center;filter:drop-shadow(0 12px 26px rgba(0,0,0,.45))}
.paper::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--paper);border-radius:30px 18px 34px 22px;filter:url(#rough)}
.paper h1{margin:0;font-size:clamp(44px,10vw,74px);line-height:.95;font-weight:700;letter-spacing:-1px;text-wrap:balance}
.paper h2{margin:0 0 6px;font-size:28px;line-height:1.1;font-weight:700;text-wrap:balance}
.paper p{margin:8px 0;color:var(--mut);line-height:1.3;font-size:18px}
.paper .tag{font-size:23px;color:var(--ink);font-weight:700;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chip{background:transparent;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:2px 16px;font-size:16px;line-height:1.15}
.chip small{display:block;font-size:12px;color:var(--mut)}
.chip.on{background:var(--ink);color:var(--paper)}.chip.on small{color:inherit;opacity:.8}
.big{position:relative;background:linear-gradient(#8fe3b8,#4fbf94 60%,#3aa883);color:#fff;border:4px solid #fff;border-radius:999px;padding:6px 30px 4px;font-size:24px;font-weight:800;letter-spacing:.02em;text-shadow:0 3px 0 rgba(8,90,70,.5);box-shadow:0 5px 0 rgba(10,80,70,.4),0 10px 14px rgba(0,0,0,.3),inset 0 -4px 6px rgba(10,100,80,.3)}
.big:disabled{opacity:.6;cursor:default}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.ghost{background:transparent;border:0;color:var(--mut);font-size:16px;text-decoration:underline;margin-top:6px}
.hint{display:block;font-size:14px;color:var(--mut);margin-top:10px}
#fsvg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto 4px}
.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.92);opacity:.5}to{transform:none;opacity:1}}
.hud{position:fixed;display:none;z-index:5}
body.race .hud{display:flex}
.pill{align-items:center;gap:8px;background:var(--hud);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:3px 16px;font-size:21px;font-weight:700;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-variant-numeric:tabular-nums}
#pT{top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px))}
#pD{top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
#pP{top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:76px;justify-content:center;text-align:center;box-sizing:border-box}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#d99a1c)}
#st{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 92px);width:30px;height:140px;border-radius:17px;background:var(--hud);border:1px solid rgba(255,255,255,.15);flex-direction:column;justify-content:flex-end;padding:5px}
#stf{border-radius:12px;background:linear-gradient(#8fd8ff,#2a8fe0);height:100%;transition:height .2s}
#stl{right:max(6px,env(safe-area-inset-right,0px));bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 196px);font-size:13px;text-align:center;line-height:1;width:62px;text-shadow:0 1px 3px #000}
.cb{width:76px;height:76px;border-radius:50%;background:var(--hud);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:34px;align-items:center;justify-content:center;bottom:max(18px,env(safe-area-inset-bottom,0px))}
.cb.p{background:rgba(255,255,255,.32)}
#cL{left:max(14px,env(safe-area-inset-left,0px))}#cR{right:max(14px,env(safe-area-inset-right,0px))}
#cS{left:50%;transform:translateX(-50%);width:92px;height:92px;background:var(--acc);flex-direction:column;font-size:19px;line-height:1.05;font-weight:700}
#cS i{font-style:normal;font-size:14px;letter-spacing:2px}
#mute{display:none;top:calc(max(12px,env(safe-area-inset-top,0px)) + 44px);right:max(12px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;background:var(--hud);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:18px;align-items:center;justify-content:center;position:fixed;z-index:5}
body.sc-race #mute,body.sc-count #mute,body.sc-end #mute{display:flex}
#toast{position:fixed;left:50%;top:calc(max(12px,env(safe-area-inset-top,0px)) + 192px);transform:translate(-50%,-8px);width:min(92vw,440px);background:var(--paper);color:var(--ink);border:2px solid var(--acc);border-radius:14px;padding:7px 12px;font-size:16px;line-height:1.25;text-align:center;opacity:0;transition:.3s;pointer-events:none;z-index:8}
#toast.show{opacity:1;transform:translate(-50%,0)}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:min(34vw,220px);font-weight:700;text-shadow:0 6px 24px rgba(0,0,0,.55);pointer-events:none;z-index:6}
.mem{display:flex;gap:12px;align-items:center;text-align:left;margin:8px 0}
.mem b{display:block;font-size:18px;line-height:1.1}.mem span{font-size:15px;color:var(--mut);line-height:1.2;display:block}
.mt{flex:none;width:76px;height:76px;border-radius:14px 8px 14px 8px;overflow:hidden;border:2px solid var(--ink)}
.mt svg{width:100%;height:100%;display:block}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:6px 0 4px;color:var(--ink);font-size:19px;font-weight:700}
.stats span small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.pc{position:fixed;z-index:7;left:50%;top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);width:min(92vw,400px);transform:translate(-50%,-140%) rotate(-2deg);opacity:0;pointer-events:none;color:#fff;border-radius:18px;padding:10px 14px;border:3px solid var(--rc,#ffe9a0);background:linear-gradient(135deg,color-mix(in srgb,var(--rc,#ffe9a0) 35%,#14202c),#14202c);box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 26px var(--rc,#ffe9a0);transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .3s}
.pc.show{transform:translate(-50%,0) rotate(0);opacity:1}
.pc small{display:block;font-size:13px;color:var(--rc,#ffe9a0)}
.pc b{display:block;font-size:20px;line-height:1.1}
.pc span{display:block;font-size:15px;line-height:1.2;margin-top:3px}
#fm{position:fixed;left:50%;top:34%;transform:translate(-50%,0);font-size:clamp(30px,7vw,52px);font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.5);pointer-events:none;z-index:7;opacity:0;white-space:nowrap}
#fm.go{animation:fmu 1s ease-out}
@keyframes fmu{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}18%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
#sl{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .25s;background:repeating-conic-gradient(from 0deg at 50% 58%,rgba(255,255,255,0) 0deg 3deg,rgba(255,255,255,.35) 3deg 3.7deg,rgba(255,255,255,0) 3.7deg 8deg);-webkit-mask-image:radial-gradient(circle at 50% 58%,transparent 34%,#000 80%);mask-image:radial-gradient(circle at 50% 58%,transparent 34%,#000 80%)}
#sl.on{opacity:.8}
#pC{top:calc(max(12px,env(safe-area-inset-top,0px)) + 66px);left:max(12px,env(safe-area-inset-left,0px));font-size:18px}
#pF{top:calc(max(12px,env(safe-area-inset-top,0px)) + 110px);left:max(12px,env(safe-area-inset-left,0px));font-size:18px}
#pF.danger{background:rgba(190,40,30,.85);animation:dz .5s infinite alternate}
@keyframes dz{to{transform:scale(1.07)}}
#pC.off,#pF.off{display:none!important}
.fcw{perspective:900px;display:flex;justify-content:center;margin:8px 0}
.fc{position:relative;width:min(80vw,310px);height:350px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.2,.4,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:4px solid var(--rc);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;text-align:center}
.fc .bk{background:repeating-linear-gradient(45deg,#26405f 0 10px,#2c4a6e 10px 20px);color:#ffe9a0;font-size:24px;font-weight:700;box-shadow:0 0 22px var(--rc)}
.fc.L .bk{animation:glw 1s infinite}
@keyframes glw{50%{box-shadow:0 0 48px var(--rc)}}
.fc .ft{transform:rotateY(180deg);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 28%,#fff6e0),#fff6e0);color:#1f3a5f;box-shadow:0 0 26px var(--rc)}
.fc .ft small{font-size:14px;color:#6a5b40}
.fc .ft h3{margin:4px 0;font-size:24px;line-height:1.05}
.fc .ft .hk{font-size:19px;font-weight:700;line-height:1.15;margin:4px 0}
.fc .ft p{margin:4px 0;font-size:15px;line-height:1.25;color:#4a3d28}
.nw{background:#d9432b;color:#fff;border-radius:10px;padding:0 8px;font-size:14px;font-weight:700}
.alb{display:grid;gap:8px;text-align:left;max-height:48vh;overflow:auto}
.as{border:2px solid var(--ink);border-radius:14px;padding:6px 10px;color:var(--ink)}
.as h4{margin:0 0 4px;font-size:18px;display:flex;justify-content:space-between}
.sl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.cs{border:2px solid var(--rc);border-radius:10px;padding:4px 8px;font-size:14px;line-height:1.15;background:color-mix(in srgb,var(--rc) 14%,transparent)}
.cs.lock{border-style:dashed;opacity:.55}
.cs b{display:block;font-size:15px}
.dia{width:15px;height:15px;background:linear-gradient(135deg,#e6faff,#37b8ff);transform:rotate(45deg) scale(.85);border-radius:3px;margin-left:6px}
.bump{animation:bp .25s}
@keyframes bp{50%{transform:translateX(-50%) scale(1.14)}}
#pW{top:calc(max(12px,env(safe-area-inset-top,0px)) + 154px);left:max(12px,env(safe-area-inset-left,0px));font-size:18px}
#pW.off{display:none!important}
/* hero / title poster */
body.sc-title::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgba(8,16,28,.1),rgba(8,16,28,.66) 88%),linear-gradient(rgba(8,16,28,.55),transparent 45%)}
.hero{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;width:min(94vw,560px);color:#fff;padding:6px 0}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;line-height:.84;font-weight:700;transform:rotate(-3deg);filter:url(#rough2) drop-shadow(0 12px 16px rgba(0,0,0,.5))}
.logo span{display:block;text-shadow:-4px 0 #16283f,4px 0 #16283f,0 -4px #16283f,0 4px #16283f,-3px -3px #16283f,3px -3px #16283f,-3px 3px #16283f,3px 3px #16283f,0 9px 0 #0c1826}
.l1{font-size:clamp(54px,min(20vw,17vh),150px);color:#ffd23f;letter-spacing:-2px}
.l2{font-size:clamp(40px,min(14vw,12vh),108px);color:#fff4d6;margin-top:4px}
.bw{position:relative;width:210px;height:92px;margin-top:10px}
.bw>div:first-child{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.wv{position:absolute;left:-10px;right:-10px;bottom:0;height:20px;background:radial-gradient(circle at 12px -3px,transparent 12px,#3a86c8 13px,#2a6aa8 17px,transparent 18px) 0 0/24px 20px repeat-x;animation:wvm 2.4s linear infinite;opacity:.95}
@keyframes wvm{to{background-position:24px 0}}
.rib{filter:drop-shadow(0 5px 0 rgba(0,0,0,.35));margin:6px 0 10px;transform:rotate(-2deg)}
.rib span{display:block;background:#d9432b;color:#fff;font-size:clamp(19px,5.2vw,27px);font-weight:700;padding:3px 34px 5px;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.vals{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;font-size:clamp(13px,3.5vw,17px);letter-spacing:.16em;text-transform:uppercase;color:#fff4d6;text-shadow:0 2px 6px #000;margin-bottom:16px}
.vals b{font-weight:700}.vals i{width:6px;height:6px;border-radius:50%;background:#ffd23f}
.play{position:relative;display:flex;align-items:center;justify-content:center;min-width:176px;height:58px;margin-top:12px;padding:0 34px;border:4px solid #fff;border-radius:999px;background:linear-gradient(#8fe3b8,#4fbf94 60%,#3aa883);box-shadow:0 5px 0 rgba(10,80,70,.45),0 12px 18px rgba(0,0,0,.35),inset 0 -5px 8px rgba(10,100,80,.3);animation:pls 1.8s ease-in-out infinite;color:#fff;font-size:30px;font-weight:800;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.play::before,.play::after{content:'';position:absolute;border-radius:50%;background:#fff}
.play::before{width:9px;height:9px;left:16%;top:-6px;box-shadow:12px 6px 0 -2px #fff}
.play::after{width:7px;height:7px;right:14%;bottom:-5px}
.play span{position:relative;z-index:1;text-shadow:0 3px 0 rgba(8,90,70,.5);padding-top:3px}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(10,80,70,.45),0 6px 10px rgba(0,0,0,.3)}
.play:disabled{opacity:.75;animation:none}
@keyframes pls{50%{transform:scale(1.04)}}
.tri{position:absolute;left:22px;top:50%;margin-top:-11px;width:0;height:0;border-left:17px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
.pick{display:flex;gap:12px;margin:14px 0 4px}
.sw{width:60px;height:60px;border-radius:50%;background:rgba(16,28,38,.55);border:3px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.sw.on{border-color:#ffd23f;background:rgba(255,210,63,.22);box-shadow:0 0 18px rgba(255,210,63,.65);transform:scale(1.12)}
.pn{font-size:14px;color:#fff4d6;text-shadow:0 1px 4px #000;min-height:19px}
.tb{margin-top:10px;display:flex;align-items:center;gap:10px;background:rgba(58,168,131,.55);color:#fff;border:3px solid #fff;border-radius:999px;padding:3px 18px 3px 12px;font-size:20px}
.tb b{color:#ffd23f}
.mrow{display:flex;gap:14px;margin-top:10px;font-size:17px;text-shadow:0 1px 4px #000}
.mrow span{display:flex;align-items:center;gap:5px}
.md{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.35);display:inline-block}
.hero .hint{color:#dfe9f2;text-shadow:0 1px 4px #000;margin-top:10px}
@media(max-height:620px){.vals,.hero .hint{display:none}.bw{height:76px}.bw svg{width:120px}.pick{margin-top:12px}.sw{width:50px;height:50px}}
/* medals */
.medal{display:block;margin:0 auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4));animation:medIn .9s cubic-bezier(.2,1.3,.4,1)}
@keyframes medIn{from{transform:translateY(-90px) scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.mpop{position:fixed;left:50%;top:max(60px,12%);transform:translateX(-50%);text-align:center;color:#fff;pointer-events:none}
.mpop b{display:block;font-size:36px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 18px rgba(0,0,0,.6)}
/* treasure box */
.tbh{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--ink);margin:2px 0}
.tbn{font-size:22px;font-weight:700;text-align:center}.tbn b{font-size:40px;line-height:1}.tbn small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.mws{display:flex;gap:8px}.mw{text-align:center}.mw small{display:block;font-size:12px;color:var(--mut)}
.mm{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),var(--mc) 55%,rgba(0,0,0,.25));color:#1c1c1c;font-weight:700;font-size:16px;border:2px solid rgba(0,0,0,.25)}
.cs summary{cursor:pointer;list-style:none}.cs summary::-webkit-details-marker{display:none}
/* race progress */
#prg{top:calc(max(12px,env(safe-area-inset-top,0px)) + 46px);left:50%;transform:translateX(-50%);width:min(46vw,280px);height:6px;border-radius:3px;background:rgba(255,255,255,.3);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
#prg .pd{position:absolute;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.5)}
#prg .me{width:20px;height:20px;top:-7px;margin-left:-10px;z-index:2;background:#e0432f}
#prg .fl{position:absolute;right:-4px;top:-9px;width:4px;height:22px;background:repeating-linear-gradient(#fff 0 4px,#222 4px 8px);border-radius:1px}
#cS.bump{animation:bp .3s}
.lvp{max-width:640px}.lvg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0;max-height:56vh;overflow:auto;padding:4px}
.lvc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.55);border:2px solid var(--ink);border-radius:14px;padding:16px 4px 6px;color:var(--ink);font-size:14px;line-height:1.1}
.lvc b{font-size:15px}.lvc small{font-size:12px;color:var(--mut)}.lvc.cur{box-shadow:0 0 0 3px var(--acc)}.lvc.lock{opacity:.5;filter:grayscale(.8)}

var AC=null,muted=false,rainGain=null,master=null,verb=null,musNext=0,musBeat=0,musMel=2,steerIx=0;

function mFreq(m){return 440*Math.pow(2,(m-69)/12)}
function dMidi(dg,oc){var n=MU.sc.length,i=((dg%n)+n)%n;return MU.root+MU.sc[i]+12*(Math.floor(dg/n)+(oc||0))}
function audio(){if(AC){if(AC.state==='suspended'&&AC.resume)AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain();master.gain.value=muted?0:1;var cp=AC.createDynamicsCompressor();master.connect(cp);cp.connect(AC.destination);
 var len=Math.floor(AC.sampleRate*2.2),ib=AC.createBuffer(2,len,AC.sampleRate);for(var c=0;c<2;c++){var dd=ib.getChannelData(c);for(var i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
 verb=AC.createConvolver();verb.buffer=ib;var vg=AC.createGain();vg.gain.value=.6;verb.connect(vg);vg.connect(master);
 var b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(var k=0;k<d.length;k++)d[k]=Math.random()*2-1;var s=AC.createBufferSource();s.buffer=b;s.loop=true;var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=3000;f.Q.value=.5;var f2=AC.createBiquadFilter();f2.type='lowpass';f2.frequency.value=7500;rainGain=AC.createGain();rainGain.gain.value=.07;s.connect(f);f.connect(f2);f2.connect(rainGain);rainGain.connect(master);s.start();
 musNext=AC.currentTime+.3}catch(e){AC=null}}
/* one soft piano-like note */
function note(f,t,dur,vol,type){if(!AC||muted)return;try{var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter(),g2=AC.createGain();
 o.type=type||'triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.003;g2.gain.value=.3;fl.type='lowpass';fl.frequency.value=Math.min(7000,f*5+400);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
 o.connect(fl);o2.connect(g2);g2.connect(fl);fl.connect(g);g.connect(master);if(verb)g.connect(verb);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05)}catch(e){}}
function pad(fr,t,dur,vol){if(!AC||muted)return;try{fr.forEach(function(f){var o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sine';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=900;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(fl);fl.connect(g);g.connect(master);if(verb)g.connect(verb);o.start(t);o.stop(t+dur+.1)})}catch(e){}}
function noiseHit(t,dur,fq,vol,sweep){if(!AC||muted)return;try{var n=Math.floor(AC.sampleRate*dur),bf=AC.createBuffer(1,n,AC.sampleRate),dd=bf.getChannelData(0);for(var i=0;i<n;i++)dd[i]=(Math.random()*2-1)*Math.sin(Math.PI*Math.pow(i/n,.6));var s=AC.createBufferSource();s.buffer=bf;var f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(fq,t);f.frequency.exponentialRampToValueAtTime(Math.max(80,fq*(sweep||2)),t+dur);var g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t)}catch(e){}}

var chT=0;
function chirp(t,f){if(!AC||muted)return;try{var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.35,t+.07);o.frequency.exponentialRampToValueAtTime(f*.9,t+.14);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+.18)}catch(e){}}

function musicTick(){if(!AC||muted||!master)return;var t=AC.currentTime;
 if(rainGain&&LVc){var rv=LVc.rain>0?.07:0;rainGain.gain.value+=(rv-rainGain.gain.value)*.05}
 if(LVc&&!LVc.night&&LVc.pf!=='snow'&&t>chT){var n=1+((Math.random()*3)|0),f=2400+Math.random()*1800;for(var k=0;k<n;k++)chirp(t+k*.17,f*(1+k*.08));chT=t+2.5+Math.random()*5}}
function musSched(t,racing){var step=musBeat%16,bar=(musBeat/16)|0,dg=MU.prog[bar%MU.prog.length],dark=(typeof storm!=='undefined'&&storm>.5)?1:0;
 if(step===0){pad([mFreq(dMidi(dg,-1)),mFreq(dMidi(dg+2,-1)),mFreq(dMidi(dg+4,-1))],t,16*60/MU.bpm/2*1.1,dark?.05:.04)}
 var rc=racing?1:0;
 if(step%4===0||(rc&&step%8===6))kick(t);
 if(step%8===4)noiseHit(t,.14,2200,rc?.13:.07,.4);
 if(rc||step%2===0)noiseHit(t,.04,7500,step%2?.03:.05,.2);
 note(mFreq(dMidi(dg,-2)+((step%4===3&&rc)?12:0)),t,rc?.28:.45,rc?.13:.09,'triangle');
 if(rc||step%2===0){var ar=[0,2,4,2,0,2,4,6][step%8];note(mFreq(dMidi(dg+ar,1)),t,.3,rc?.065:.045,'triangle')}

 var p=racing?(dark?.42:.58):.42;
 if(step%4===0&&Math.random()<.85*(MU.sp||1)||Math.random()<p*.55*(MU.sp||1)){var mv=[-2,-1,-1,0,1,1,2,3][(Math.random()*8)|0];musMel=Math.max(-3,Math.min(8,musMel+mv));note(mFreq(dMidi(musMel,0)+(dark?-12:0)),t,2.0,.05+Math.random()*.03)}
 if(racing&&step%8===4&&Math.random()<.5)note(mFreq(dMidi(dg+4,1)),t+.02,1.2,.03);
 if(MU.dr&&step===0)pad([mFreq(dMidi(0,-2)),mFreq(dMidi(0,-2)+7)],t,16*60/MU.bpm/2*1.1,.03);
 if(MU.pl&&step%4===2&&Math.random()<.4){var q=(musMel+((Math.random()*5)|0)-2);note(mFreq(dMidi(q,1)),t,.7,.035,'triangle')}
 if(MU.bl&&step%8===0&&Math.random()<.75){note(mFreq(dMidi((Math.random()*5)|0,2)),t+.03,2.8,.04,'sine');note(mFreq(dMidi(4,3)),t+.2,1.6,.018,'sine')}
 musBeat++}
function blip(fr,du,ty){if(!AC||muted)return;try{var o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=fr;g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+du);o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+du)}catch(e){}}

function sfx(k,a){if(!AC||muted)return;var t=AC.currentTime;
 if(k==='steer'){steerIx=Math.max(-3,Math.min(5,steerIx+(a>0?1:-1)));if(Math.abs(steerIx)>4)steerIx=a>0?-2:2;note(mFreq(dMidi(3+steerIx,0)),t,.7,.07)}
 else if(k==='coin'){var q=(a||0)%8;bell(mFreq(dMidi(q,2)),t,.09);bell(mFreq(dMidi(q+2,2)),t+.07,.06)}
 else if(k==='gem'){[0,2,4,7,9].forEach(function(x,i){bell(mFreq(dMidi(x,2)),t+i*.06,.07)});noiseHit(t,.3,4000,.03,.5)}
 else if(k==='booster'){noiseHit(t,.5,500,.14,6);[0,2,4,7,9,11].forEach(function(x,i){bell(mFreq(dMidi(x,2)),t+.05+i*.05,.05)})}
 else if(k==='flip'){noiseHit(t,.1,2400,.045,.3);note(mFreq(dMidi(4,2)),t+.02,.5,.035,'sine')}
 else if(k==='fact'){[0,4,7,11,14].forEach(function(x,i){note(mFreq(dMidi(x,1)),t+i*.09,1.8,.08)});pad([mFreq(dMidi(0,0)),mFreq(dMidi(2,0)),mFreq(dMidi(4,0))],t,2.4,.05)}

 else if(k==='hit'){note(mFreq(dMidi(0,-3)),t,.45,.2,'sine');noiseHit(t,.22,500,.2,.3);noiseHit(t+.03,.12,1800,.08,.5)}
 else if(k==='mud'){note(mFreq(dMidi(0,-3)),t,.4,.1,'sine');noiseHit(t,.3,220,.12,.6)}
 else if(k==='bump'){note(mFreq(dMidi(1,-2)),t,.3,.08,'sine')}
 else if(k==='near'){var q2=Math.min(a||0,6);note(mFreq(dMidi(2+q2,1)),t,.7,.06);note(mFreq(dMidi(4+q2,2)),t+.06,.5,.04)}
 else if(k==='pass'){note(mFreq(dMidi(4,1)),t,.5,.06);note(mFreq(dMidi(7,1)),t+.08,.7,.06)}
 else if(k==='tick'){note(mFreq(dMidi(0,1)),t,.4,.07)}
 else if(k==='go'){[0,4,7,11].forEach(function(x,i){note(mFreq(dMidi(x,1)),t+i*.05,1.4,.08)})}
 else if(k==='win'){var up=[0,2,4,7,9,11,14];for(var i=0;i<up.length;i++)note(mFreq(dMidi(up[i],1)),t+i*.1,1.6,.08);if((a||4)<=3){pad([mFreq(dMidi(0,0)),mFreq(dMidi(2,0)),mFreq(dMidi(4,0)),mFreq(dMidi(7,0))],t+.2,3,.05)}}
 else if(k==='sink'){[7,5,3,0,-2].forEach(function(x,i){note(mFreq(dMidi(x,0)),t+i*.16,1.2,.07,'sine')});noiseHit(t+.5,.9,700,.12,.3)}}

(function(){var C=['#6fc3ff','#ff9ae0','#ffd36b','#8fe8b4','#ffa27a','#b9a2ff'],n=CARDS.length;
 [['Taj Mahal','A tomb of white marble, built for love.','Emperor Shah Jahan built the Taj Mahal in Agra for his wife Mumtaz Mahal. Work began around 1632 and the whole complex took about 20 years and thousands of craftsmen. The white marble was brought from Makrana in Rajasthan.'],
 ['Qutub Minar','The tallest brick minaret in the world.','The Qutub Minar in Delhi is 72.5 metres tall and was started around 1200, more than 800 years ago. Its five storeys are covered in red sandstone and carved verses, and it is a UNESCO World Heritage Site.'],
 ['Monsoon rains','Some of the wettest places on Earth.','India gets most of its yearly rain in the monsoon months, from June to September. Mawsynram, a village in Meghalaya, is one of the rainiest places on Earth, with more than 11 metres of rain in an average year.'],
 ['Zero came from India','Every AI runs on numbers.','The number zero, used as a number in its own right, was described by the Indian mathematician Brahmagupta around the year 628. Modern AI is billions of numbers being added and multiplied, and none of it works without zero.'],
 ['Big Ben is a bell','The tower has a different name.','“Big Ben” is the nickname of the huge bell inside the Elizabeth Tower at the Palace of Westminster. The bell weighs about 13.7 tonnes and the clock has kept time since 1859.'],
 ['Tower Bridge','It is not London Bridge.','Tower Bridge opened in 1894. Its two road decks, called bascules, lift up to let tall ships sail through. People often mix it up with London Bridge, a much plainer bridge just upstream.'],
 ['Regent’s Canal','London has secret canals.','The Regent’s Canal, opened in 1820, runs about 13 kilometres from Little Venice through Camden to the River Thames at Limehouse. Colourful narrowboats still travel along it today.'],
 ['Eiffel Tower grows','It is taller in summer.','The Eiffel Tower is about 330 metres tall and was built for the 1889 World’s Fair. Hot weather makes the iron expand, so in summer it grows by up to about 15 centimetres.'],
 ['The New Bridge','Pont Neuf is the oldest bridge.','Paris’s Pont Neuf means “New Bridge”, but it was finished in 1607 and is the oldest standing bridge across the Seine in the city.'],
 ['Canal Saint-Martin','A canal that slips underground.','Built in the 1820s, the Canal Saint-Martin is about 4.5 kilometres long and has nine locks. Part of it flows through tunnels under the streets of Paris, and boats still pass through them.'],
 ['165 canals','More bridges than you can count.','Amsterdam has around 165 canals and well over a thousand bridges. Its 17th-century canal ring is a UNESCO World Heritage Site.'],
 ['Skinny houses','Tall, narrow and full of hooks.','Many old Amsterdam houses are tall and narrow because owners were once taxed on the width of their front. Most have a hook at the top so furniture can be hoisted up outside, since the stairs are too steep.'],
 ['Land from the sea','A quarter of the country is below sea level.','About a quarter of the Netherlands lies below sea level. The Dutch have used dykes, windmills and pumps for centuries to keep that land dry.'],
 ['Statue of Liberty','A gift that turned green.','France gave the Statue of Liberty to the United States and it was unveiled in 1886. It is made of copper, which weathered to its green colour within about 30 years.'],
 ['Brooklyn Bridge','Elephants once crossed it.','The Brooklyn Bridge opened in 1883 and was then the longest suspension bridge in the world. In 1884 the showman P. T. Barnum led 21 elephants across it to prove it was safe.'],
 ['East River','It is not really a river.','New York’s East River is actually a tidal strait, a saltwater channel that joins Upper New York Bay to Long Island Sound. Its water flows in both directions with the tides.'],
 ['Christ the Redeemer','A giant on a mountain.','Christ the Redeemer stands 30 metres tall on top of Corcovado mountain in Rio and was finished in 1931. It is covered in thousands of small soapstone tiles and is often struck by lightning.'],
 ['Sugarloaf cable car','One of the first in the world.','A cable car has carried people up Rio’s Sugarloaf Mountain since 1912, one of the first cable cars anywhere. The granite peak rises almost 400 metres above Guanabara Bay.'],
 ['Arcos da Lapa','An aqueduct that carries a tram.','The white Arcos da Lapa in Rio are an old aqueduct finished in the 1750s. Today a yellow tram rolls across the top on its way to the hilly Santa Teresa neighbourhood.'],
 ['Kyoto, the old capital','Over a thousand years of history.','Kyoto was the capital of Japan from the year 794 until 1868. It still has about 1,600 Buddhist temples and 400 Shinto shrines.'],
 ['Fushimi Inari','A mountain path of red gates.','At Kyoto’s Fushimi Inari shrine, thousands of bright orange-red torii gates form long tunnels up the mountain. Each gate was given by a person or a business.'],
 ['The Golden Pavilion','Covered in gold leaf.','Kinkaku-ji, the Golden Pavilion in Kyoto, has its top two floors covered in gold leaf. A monk set fire to it in 1950 and it was rebuilt in 1955.'],
 ['Paper began here','The paper in your boat came from China.','Paper was invented in China about 2,000 years ago. A court official named Cai Lun is credited with improving the recipe in the year 105, using bark, rags and old fishing nets.'],
 ['The Grand Canal','The longest canal in the world.','China’s Grand Canal is about 1,770 kilometres long, the longest artificial waterway on Earth. Parts of it are over 1,400 years old, and it passes through water towns such as Suzhou.'],
 ['Venice of the East','Whole towns built on water.','Water towns such as Zhouzhuang, near Shanghai, are about 900 years old. Streets run beside canals crossed by stone arch bridges, and boats were once the main way to travel.'],
 ['The Lion City','That is what the name means.','“Singapura” comes from Sanskrit words meaning “Lion City”. The Merlion, a statue with a lion’s head and a fish’s body, spouts water beside the mouth of the Singapore River.'],
 ['Supertrees','Giant trees made of steel.','The Supertrees at Gardens by the Bay are 18 tree-shaped towers between 25 and 50 metres tall. They are covered in living plants, collect rainwater, and light up at night.'],
 ['A cleaned-up river','From crowded to sparkling.','The Singapore River was once crowded and polluted. A huge clean-up between 1977 and 1987 moved boats and street traders away and made the water clean again.'],
 ['SEA-LION','An AI for Southeast Asia.','AI Singapore built SEA-LION, a family of language models trained on languages of Southeast Asia, such as Malay, Thai, Indonesian and Vietnamese, so that AI can understand the region better.'],
 ['City on the marsh','Built by order of a tsar.','Peter the Great founded Saint Petersburg in 1703 on marshy islands by the Baltic Sea. It has hundreds of bridges and dozens of canals and rivers, so it is called the Venice of the North.'],
 ['Bridges that rise','They open at night.','In summer, Saint Petersburg’s drawbridges lift up at night so ships can pass. During the white nights, when the sun barely sets, crowds gather to watch them rise.'],
 ['Hermitage cats','The museum has a cat guard.','The Hermitage Museum, inside the Winter Palace, has cats that live in its cellars and keep mice away. There are around fifty of them, and staff and volunteers look after them.'],
 ['Neuschwanstein','The castle from a fairy tale.','King Ludwig II of Bavaria began building Neuschwanstein Castle in 1869. It is said to have inspired Disney’s Sleeping Beauty Castle, and he died before it was finished.'],
 ['Surfing in the city','A wave in the middle of Munich.','In the Eisbach, a small river in Munich’s English Garden, a wave stays in one place all year. Surfers have ridden it since the 1970s, right in the middle of the city.'],
 ['A law about beer','The Reinheitsgebot of 1516.','In 1516, Bavaria passed the Reinheitsgebot, a purity law that said beer could only be made from water, barley and hops. It is often called one of the oldest food laws.']

function hold(el,d){function on(e){e.preventDefault();ctl[d]=1;el.classList.add('p')}function off(){ctl[d]=0;el.classList.remove('p')}el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(function(n){el.addEventListener(n,off)})}

var lt=0,cullT=0;

function frame(ts){
 var dt=Math.min(.05,(ts-lt)/1000||0);lt=ts;if(paused&&state==='race')dt=0;T+=dt;curDt=dt;
 var rawDt=(ts-lt0)/1000||0;lt0=ts;if(rawDt>0&&rawDt<.5){fEma+=(rawDt-fEma)*.05;if(fEma>.036&&QREF)lowT+=rawDt;else lowT=Math.max(0,lowT-rawDt);if(lowT>3&&QREF){QREF=0;if(wU)wU.uRq.value=0}}
 if(ready){
  var sdt=dt;if(G.slow>0){G.slow-=dt;sdt=dt*.45}
  if(paused&&state!=='race'){paused=false;document.body.classList.remove('pz')}if(state==='race'&&!paused)stepRace(sdt);else if(state==='end')stepEnd(dt);
  var tg=(state==='race'||state==='count')?stormAt(P.z):0,ps=storm;storm+=(tg-storm)*Math.min(1,dt*1.5);
  if(ps<.5&&storm>=.5&&state==='race'){floatMsg(LVc.snow?'Blizzard!':(LVc.wet?'Downpour!':'Strong winds!'),'#bfe3ff')}
  if(storm>.55&&state==='race'){G.flashT-=dt;if(G.flashT<=0){G.flashT=2.5+rnd()*4;flashV=.6;setTimeout(function(){flashV=.45},130);setTimeout(thunder,450+rnd()*500)}}
  flashV=Math.max(0,flashV-dt*3.4);
  var fd=LVc.fd+.012*storm;scene.fog.density=fd;wU.uFogD.value=fd;hemi.intensity=HB-.28*storm+flashV*1.1;var wetv=LVc.wet||0;rainMesh.visible=RW>0||(wetv>0&&storm>.05);rainMesh.material.opacity=Math.min(.9,(RW>0?.12+.4*RW:0)+.3*storm*wetv);
  var wvv=windNow;CLO.forEach(function(l){var ph=l.userData.ph;l.rotation.z=Math.sin(T*2.2+ph)*.12+wvv*(.7+.5*Math.sin(T*9+ph));l.rotation.y=Math.sin(T*1.7+ph)*.3+wvv*.9});
  LAMPS.forEach(function(b){b.scale.setScalar(2.6+storm*2.4)});
  wU.uT.value=T;SPIN.forEach(function(sp){sp.o.rotation.z+=sp.s*dt});sky.rotation.y=T*.004;if(!paused){musicTick();updAir(dt)}
  for(var i=0;i<ripples.length;i++)ripples[i].t+=dt;ripples=ripples.filter(function(r){return r.t<2.2}).slice(-10);
  for(var i=0;i<10;i++){var r=ripples[ripples.length-1-i],v=wU.uR.value[i];if(r)v.set(r.x,r.z,r.t,r.s);else v.set(0,0,99,0)}
  placeBoat(P);F.forEach(placeBoat);
  G.wk=(G.wk||0)+dt;if(G.wk>.03){G.wk=0;if(state==='race'||state==='end'){if(P.v>1.5)foam(cen(P.z)+P.u,P.z+.7,P.boostT>0?3:1,1.4);F.forEach(function(f){if(f.v>1)foam(cen(f.z)+f.u,f.z+.7,1,1)})}}
  $('sl').classList.toggle('on',state==='race'&&P.boostT>0);
  var sw=state==='race'&&G.gap<40&&G.gap>-1.8;wave.visible=sw;if(sw){wave.position.set(cen(G.wz),.55+Math.sin(T*5)*.09,G.wz);wave.rotation.y=Math.atan(dcen(G.wz));wave.scale.y=1+Math.sin(T*3)*.1}
  TRS.forEach(function(t){if(t.got)return;t.m.position.set(cen(t.z)+t.u,.38+Math.sin(T*2.6+t.k)*.08,t.z);if(t.k===4){t.m.position.y=1.15;t.m.rotation.y=0;t.m.children[0].rotation.z=T*2.2;t.m.children[1].rotation.z=-T*3}else t.m.rotation.y=T*1.5;t.m.scale.setScalar(t.k>=2?1+.12*Math.sin(T*5):1)});
  OB.forEach(function(o){if(o.type==='drain'){o.m.position.set(cen(o.z)+o.u,.03,o.z);o.m.rotation.z=T*2.2}else if(o.type==='mud')o.m.position.set(cen(o.z)+o.u,.035,o.z);else if(o.type==='duck'){var vv=Math.cos(T*o.mv.w+o.mv.ph);o.u=o.mv.u0+Math.sin(T*o.mv.w+o.mv.ph)*o.mv.a*.85;o.m.position.set(cen(o.z)+o.u,Math.sin(T*3+o.mv.ph)*.04,o.z);o.m.rotation.y=vv>0?Math.PI/2:-Math.PI/2;o.m.rotation.z=Math.sin(T*6)*.06}else o.m.position.set(cen(o.z)+o.u,0,o.z)});
  driveKids(dt);placeKid(KP);KF.forEach(placeKid);updWalkers(dt);
  var cp=window.__cp||glance(camPlan());if(!lk){lk=new THREE.Vector3();lk.copy(cp.l)}
  var ck=1-Math.exp(-cp.k*dt);cam.position.lerp(cp.p,ck);lk.lerp(cp.l,1-Math.exp(-8*dt));
  G.shake=Math.max(0,(G.shake||0)-dt);if(G.shake>0){cam.position.x+=(rnd()-.5)*.75*G.shake;cam.position.y+=(rnd()-.5)*.6*G.shake}
  cam.lookAt(lk);if(state==='race')cam.rotation.z-=P.vu*.01;
  var fv=cp.f+((state==='race'&&P.boostT>0)?7:0);cam.fov+=(fv-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();
  wU.uCam.value.copy(cam.position);sky.position.copy(cam.position);camZ=cam.position.z-6;
  cullT-=dt;if(cullT<=0){cullT=.2;for(var i=0;i<cull.length;i++){var c=cull[i];c.o.visible=(c.z<camZ+36&&c.z>camZ-210)}TRS.forEach(function(t){if(t.got)t.m.visible=false})}
  updRain(dt);updBurst(dt);updConf(dt);paintRender();
 }
 requestAnimationFrame(frame)}
